name: Release To-DoX

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate CEA release channel
        run: node scripts/release-channel.cjs

      - name: Build and publish Electron app
        run: npm run electron:build:win -- --config.publish.channel=${{ env.CEA_RELEASE_CHANNEL == 'stable' && 'latest' || env.CEA_RELEASE_CHANNEL }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
